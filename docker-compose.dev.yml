version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: phishcatcher-postgres
    environment:
      POSTGRES_DB: phishcatcher
      POSTGRES_USER: phishcatcher
      POSTGRES_PASSWORD: phishcatcher_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./phishcatcher-backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "5432:5432"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishcatcher -d phishcatcher"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: phishcatcher-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: phishcatcher
      MONGO_INITDB_ROOT_PASSWORD: phishcatcher_password
      MONGO_INITDB_DATABASE: phishcatcher
    volumes:
      - mongodb_data:/data/db
      - ./phishcatcher-backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: phishcatcher-redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: phishcatcher-minio
    environment:
      MINIO_ROOT_USER: phishcatcher
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - phishcatcher-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO Client for bucket creation
  minio-init:
    image: minio/mc:latest
    container_name: phishcatcher-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - phishcatcher-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 phishcatcher minio_password;
      /usr/bin/mc mb myminio/phishcatcher-emails;
      /usr/bin/mc mb myminio/phishcatcher-reports;
      /usr/bin/mc mb myminio/phishcatcher-models;
      /usr/bin/mc policy set public myminio/phishcatcher-emails;
      /usr/bin/mc policy set public myminio/phishcatcher-reports;
      /usr/bin/mc policy set public myminio/phishcatcher-models;
      exit 0;
      "
    restart: "no"

  # Elasticsearch for logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: phishcatcher-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: phishcatcher-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: phishcatcher-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./phishcatcher-backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: phishcatcher-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./phishcatcher-backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - phishcatcher-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # RabbitMQ for Celery message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: phishcatcher-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: phishcatcher
      RABBITMQ_DEFAULT_PASS: rabbitmq_password
      RABBITMQ_DEFAULT_VHOST: phishcatcher
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - phishcatcher-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./phishcatcher-backend
      dockerfile: Dockerfile
    container_name: phishcatcher-celery-worker
    environment:
      - DATABASE_URL=postgresql://phishcatcher:phishcatcher_password@postgres:5432/phishcatcher
      - MONGODB_URL=mongodb://phishcatcher:phishcatcher_password@mongodb:27017/phishcatcher
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=phishcatcher
      - MINIO_SECRET_KEY=minio_password
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ./phishcatcher-backend:/app
      - ./phishcatcher-backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - phishcatcher-network
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ./phishcatcher-backend
      dockerfile: Dockerfile
    container_name: phishcatcher-celery-beat
    environment:
      - DATABASE_URL=postgresql://phishcatcher:phishcatcher_password@postgres:5432/phishcatcher
      - MONGODB_URL=mongodb://phishcatcher:phishcatcher_password@mongodb:27017/phishcatcher
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/0
    volumes:
      - ./phishcatcher-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phishcatcher-network
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped

  # Flower for Celery monitoring
  flower:
    build:
      context: ./phishcatcher-backend
      dockerfile: Dockerfile
    container_name: phishcatcher-flower
    environment:
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - phishcatcher-network
    command: celery -A app.tasks.celery_app flower --port=5555
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./phishcatcher-backend
      dockerfile: Dockerfile
    container_name: phishcatcher-backend
    environment:
      - DATABASE_URL=postgresql://phishcatcher:phishcatcher_password@postgres:5432/phishcatcher
      - MONGODB_URL=mongodb://phishcatcher:phishcatcher_password@mongodb:27017/phishcatcher
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=phishcatcher
      - MINIO_SECRET_KEY=minio_password
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=8000
    volumes:
      - ./phishcatcher-backend:/app
      - ./phishcatcher-backend/models:/app/models
      - ./phishcatcher-backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - phishcatcher-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend
  frontend:
    build:
      context: ./phishcatcher-frontend/app
      dockerfile: Dockerfile
    container_name: phishcatcher-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./phishcatcher-frontend/app:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - phishcatcher-network
    command: npm run dev
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: phishcatcher-nginx
    volumes:
      - ./phishcatcher-backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./phishcatcher-backend/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - phishcatcher-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  phishcatcher-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
