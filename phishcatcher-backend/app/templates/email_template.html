<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishCatcher - {{subject}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(139, 92, 246, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .orb-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        .orb-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .header {
            padding: 40px 40px 20px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.1);
            padding: 8px;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }
        
        .content {
            padding: 30px 40px;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
        }
        
        .message {
            color: #cbd5e1;
            margin-bottom: 24px;
            line-height: 1.7;
        }
        
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        
        .action-button {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        
        .security-info {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 24px 0;
        }
        
        .security-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 12px;
        }
        
        .security-text {
            color: #cbd5e1;
            font-size: 14px;
        }
        
        .footer {
            padding: 20px 40px 40px 40px;
            text-align: center;
            border-top: 1px solid rgba(139, 92, 246, 0.1);
            background: rgba(15, 23, 42, 0.5);
        }
        
        .footer-text {
            color: #94a3b8;
            font-size: 12px;
        }
        
        .footer-link {
            color: #a78bfa;
            text-decoration: none;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        /* Status-specific styles */
        .status-success { border-color: rgba(34, 197, 94, 0.2); }
        .status-warning { border-color: rgba(245, 158, 11, 0.2); }
        .status-error { border-color: rgba(239, 68, 68, 0.2); }
        
        @media (max-width: 600px) {
            .email-container {
                margin: 10px;
                border-radius: 12px;
            }
            
            .orb-container {
                width: 60px;
                height: 60px;
                top: 15px;
                right: 15px;
            }
            
            .header, .content, .footer {
                padding: 30px 25px;
            }
            
            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container status-{{status}}">
        <!-- Orb Glow Sphere -->
        <div class="orb-container">
            <img src="https://phishcatcher.io/orb_glow_sphere.png" alt="Security Orb" class="orb-image">
        </div>
        
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="https://phishcatcher.io/phishcatcher.png" alt="PhishCatcher" class="logo-img">
                <span class="logo-text">PhishCatcher</span>
            </div>
        </div>
        
        <!-- Content -->
        <div class="content">
            <h1 class="title">{{title}}</h1>
            
            <div class="message">
                {{message}}
            </div>
            
            {% if action_url %}
            <div class="button-container">
                <a href="{{action_url}}" class="action-button">
                    {{action_text}}
                </a>
            </div>
            {% endif %}
            
            {% if security_info %}
            <div class="security-info">
                <div class="security-title">
                    🔒 Security Information
                </div>
                <div class="security-text">
                    {{security_info}}
                </div>
            </div>
            {% endif %}
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                This email was sent by PhishCatcher. If you didn't request this, please 
                <a href="https://phishcatcher.io/support" class="footer-link">contact support</a>.
                <br><br>
                © 2026 PhishCatcher. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>
